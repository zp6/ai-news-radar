name: Link Check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'README.md'
      - '.github/workflows/link-check.yml'

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links in README
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --max-concurrency 4
            --accept 200,206,429
            --exclude-mail
            --exclude 'x\.com'
            --exclude 'twitter\.com'
            --exclude 'reddit\.com'
            README.md
          fail: false
          output: ./lychee-report.md

      - name: Create issue if links are broken
        if: failure()
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🔗 Broken links detected (weekly check)"
          content-filepath: ./lychee-report.md
          labels: maintenance, broken-link
